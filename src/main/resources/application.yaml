spring:
  application:
    name: planwith-fo-chat
  autoconfigure:
    exclude:
      - org.springframework.boot.redis.autoconfigure.RedisAutoConfiguration
      - org.springframework.boot.redis.autoconfigure.RedisReactiveAutoConfiguration
      - org.springframework.boot.redis.autoconfigure.health.RedisHealthContributorAutoConfiguration
      - org.springframework.boot.redis.autoconfigure.health.RedisReactiveHealthContributorAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisReactiveAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisReactiveRepositoriesAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3307/chat_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:chat_user}
    password: ${DB_PASSWORD:chat_pass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: UTC
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mongodb:
    uri: ${MONGO_URI:mongodb://127.0.0.1:27017/chat_db}
  data:
    mongodb:
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:planwith-fo-chat}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      auto-startup: ${CHAT_KAFKA_CONSUMER_ENABLED:${CHAT_KAFKA_ENABLED:false}}

server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:8088}

eureka:
  client:
    # Docker/AWS 기본 on. 로컬 단독은 .env에서 false로 끈다.
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    serviceUrl:
      # Docker DNS 기본값. 로컬 Eureka는 .env에서 localhost로 덮어쓴다.
      defaultZone: "${EUREKA_DEFAULT_ZONE:http://discovery:8761/eureka/}"
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:false}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    # Prefer Gateway-aggregated UI in Docker; enable locally if needed
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    path: /swagger-ui.html

app:
  gateway:
    # Relative "/" avoids embedding a host IP in OpenAPI servers.
    # Set to the public Gateway URL only when clients must see an absolute base (no LAN IP in git).
    public-url: ${GATEWAY_PUBLIC_URL:/}
    internal-token: ${GATEWAY_INTERNAL_TOKEN:}
    trust-check-enabled: ${GATEWAY_TRUST_CHECK_ENABLED:false}
  auth:
    id: ${LOGIN_ID:test-001}
    pw: ${LOGIN_PASSWORD:1234}
  deploy:
    marker: ${DEPLOY_MARKER:planwith-fo-chat-deploy-v1}
  kafka:
    enabled: ${CHAT_KAFKA_ENABLED:false}
    consumer-enabled: ${CHAT_KAFKA_CONSUMER_ENABLED:${CHAT_KAFKA_ENABLED:false}}
    created-topic: ${MEETING_TOPIC_CREATED:planwith.meeting.created}
    completed-topic: ${MEETING_TOPIC_COMPLETED:planwith.meeting.completed}
    disbanded-topic: ${MEETING_TOPIC_DISBANDED:planwith.meeting.disbanded}
    participation-changed-topic: ${MEETING_TOPIC_PARTICIPATION_CHANGED:planwith.meeting.participation.changed}
    message-created-topic: ${CHAT_TOPIC_MESSAGE_CREATED:planwith.chat.message.created}
  redis:
    enabled: ${CHAT_REDIS_ENABLED:false}
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    channel-prefix: "${CHAT_REDIS_CHANNEL_PREFIX:chat:room:}"
    presence-ttl: ${CHAT_PRESENCE_TTL:5m}

management:
  health:
    kafka:
      enabled: ${CHAT_KAFKA_ENABLED:false}
    mongo:
      enabled: ${CHAT_MONGO_HEALTH_ENABLED:true}
    redis:
      enabled: ${CHAT_REDIS_ENABLED:false}
