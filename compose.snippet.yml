  planwith-fo-chat:
    image: planwith/planwith-fo-chat:latest
    pull_policy: never
    container_name: planwith-planwith-fo-chat
    restart: unless-stopped
    depends_on:
      discovery:
        condition: service_started
      mysql:
        condition: service_healthy
    ports:
      # LAN/다른 PC는 Gateway :8000만 사용. 서비스 포트는 서버 localhost 디버그용.
      - "127.0.0.1:8088:8088"
    env_file:
      - ./env/common.env
      - ./env/chat.env
    environment:
      SERVER_PORT: 8088
      SERVER_ADDRESS: 0.0.0.0
      SPRING_APPLICATION_NAME: planwith-fo-chat
      # OpenAPI JSON은 Gateway /docs/<service> 가 가져감. UI는 :8000.
      SPRINGDOC_SWAGGER_UI_ENABLED: "false"
    networks:
      - planwith-net
